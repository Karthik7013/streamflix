name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE on env scoping (read before touching):
    # - Test steps run with NO env on purpose. Tests are written to run
    #   unconfigured, like local `npx vitest run`. UPSTASH_* vars must stay
    #   unset: dummy URLs construct a live Redis client whose retry storm
    #   times tests out. Every external is mocked.
    # - Only the build step gets env. Prerendering reads from the database,
    #   so DATABASE_URL comes from the repo secret (read-only usage, zero
    #   writes). The rest are dummies: only presence is validated at import,
    #   and missing Redis degrades gracefully. Do NOT add production secrets.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Advisory-only for now (continue-on-error): 1 critical + 15 highs
      # remain in transitive build tooling (sharp/libvips, micromatch,
      # workbox, drizzle-kit, ts-morph) with no non-breaking fix. New CVEs
      # still show up as a visible warning on every run. Flip to blocking
      # (remove continue-on-error) once residuals hit zero via Dependabot
      # majors — a permanently red gate would just get ignored.
      - name: audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npx tsc --noEmit

      - name: tests
        run: npx vitest run

      - name: build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-secret-for-build-only
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          EMAIL: ci@example.com
          APP_PASSWORD: ci
          TMDB_API_KEY: ci
          IA_S3_ACCESS_KEY: ci
          IA_S3_SECRET_KEY: ci
          IA_S3_BUCKET: ci
          IA_S3_ENDPOINT: https://s3.us.archive.org
          NVIDIA_API_KEY: ci
          KILOCODE_API_KEY: ci

      # Guest-safe read-only flows (no logins, no mutations, no seeded data).
      # Reuses the .next build above via `npm start`; needs the database at
      # runtime for server-rendered pages. Browsers install in ~30 s.
      - name: e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-secret-for-build-only
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GITHUB_CLIENT_ID: ci
          GITHUB_CLIENT_SECRET: ci
          TMDB_API_KEY: ci
